name: Desktop packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      milestone:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Record the packaged version
        run: node scripts/release-version.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm test
      - run: pnpm test:desktop scripts/release-plan.test.mjs scripts/release-publish.test.mjs
      - name: Build native package
        run: pnpm dist --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Configure Linux Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify Linux sandboxed renderer and editor
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum pnpm exec electron . --smoke-test
          xvfb-run --auto-servernum pnpm test:editor
          xvfb-run --auto-servernum pnpm test:recovery
      - name: Verify Windows and macOS sandboxed renderer and editor
        if: runner.os != 'Linux'
        run: |
          pnpm exec electron . --smoke-test
          pnpm test:editor
          pnpm test:recovery
      - uses: actions/upload-artifact@v4
        with:
          name: squidware-release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: squidware-release-*
          path: release
          merge-multiple: true
      - name: Recheck fulfillment and publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MILESTONE: ${{ inputs.milestone }}
        run: node scripts/release-publish.mjs "$VERSION" "$SOURCE_SHA" "$MILESTONE"
