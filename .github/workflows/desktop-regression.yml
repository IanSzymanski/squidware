name: Desktop regression
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-regression-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha || 'branch' }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify production desktop, PDFs and packaged startup
        run: pnpm certify --layer=desktop ${{ runner.os == 'Linux' && '--configure-sandbox' || '' }}
      - name: Render representative Linux PDF pages
        if: runner.os == 'Linux'
        run: |
          print_output=$(node scripts/run-desktop-regressions.mjs --print-output)
          python scripts/render-print.py "$print_output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-regression-${{ matrix.os }}
          path: |
            .qa/**/results*.json
            .qa/**/report.json
            .qa/**/manifest.json
            .qa/**/pdf-verification.json
            .qa/**/*.pdf
            .qa/**/*.png
            .qa/**/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: squidware-renderer
          path: dist
          if-no-files-found: error
