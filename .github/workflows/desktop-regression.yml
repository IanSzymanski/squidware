name: Desktop regression
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-regression-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha || 'branch' }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: python -m pip install -r scripts/print-requirements.txt
      - run: pnpm build
      - run: pnpm test:native
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Linux production workflows
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/run-desktop-regressions.mjs
      - name: Windows and macOS production workflows
        if: runner.os != 'Linux'
        run: node scripts/run-desktop-regressions.mjs
      - name: Verify rendered PDF text, geometry, page sizes and pagination
        run: python scripts/verify-print.py "$(node scripts/run-desktop-regressions.mjs --print-output)"
      - name: Render representative Linux PDF pages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          print_output=$(node scripts/run-desktop-regressions.mjs --print-output)
          pdftoppm -f 1 -singlefile -scale-to 1400 -png "$print_output/charts-letter.pdf" "$print_output/chart-preview"
          pdftoppm -f 1 -singlefile -scale-to 1400 -png "$print_output/coordinates-a4.pdf" "$print_output/coordinates-preview"
          pdftoppm -f 1 -singlefile -scale-to 1400 -gray -png "$print_output/dense-a4.pdf" "$print_output/monochrome-preview"
      - name: Build unpacked production application
        run: pnpm exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Configure packaged Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Verify packaged Linux application and recovery worker
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/packaged-smoke.mjs
      - name: Verify packaged Windows and macOS application and recovery worker
        if: runner.os != 'Linux'
        run: node scripts/packaged-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-regression-${{ matrix.os }}
          path: |
            .qa/**/results*.json
            .qa/**/report.json
            .qa/**/manifest.json
            .qa/**/pdf-verification.json
            .qa/**/*.pdf
            .qa/**/*.png
            .qa/**/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: squidware-renderer
          path: dist
          if-no-files-found: error
