name: Repair v0.6 download checksums

on:
  push:
    branches: [codex/v0.6-release-checksums]
    paths: [.github/workflows/repair-v0.6-checksums.yml]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Correct the checksum filename without changing packages or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const repository = 'IanSzymanski/squidware';
          const expected = new Map([
            ['Squidware-0.6.0-arm64.dmg', '008b906b0e70fa9d81b7aff08376c2e92bb00bd61f023cc1ba82c2b8b09befde'],
            ['Squidware-0.6.0.AppImage', 'e05cf150c76e51981a12d76dd0e09885e6c3a7e94320282847ef0961e3dfaac0'],
            ['Squidware.0.6.0.exe', '7ebb81991f01044cc31ed61428d249360e6ff8e2edb0b7323a0aeffddf24a482'],
          ]);
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          async function api(route, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${route}`, { method, headers, ...(body ? { body: JSON.stringify(body) } : {}) });
            if (!response.ok) throw new Error(`${method} ${route}: ${response.status}`);
            return response.status === 204 ? null : response.json();
          }
          const release = await api('releases/tags/v0.6.0');
          if (release.id !== 419700803 || release.draft || release.tag_name !== 'v0.6.0') throw new Error('Unexpected release.');
          const tag = await api('git/ref/tags/v0.6.0');
          if (tag.object.sha !== '0f199159f2fa335a14874610caa985a116baa5ca') throw new Error('Release tag changed.');
          function verifyPackages(assets) {
            const packages = assets.filter(asset => /\.(exe|dmg|AppImage)$/.test(asset.name));
            if (packages.length !== expected.size) throw new Error('Unexpected package inventory.');
            for (const asset of packages) if (asset.state !== 'uploaded' || asset.digest !== `sha256:${expected.get(asset.name)}`) throw new Error('Package identity changed.');
          }
          verifyPackages(release.assets);
          const content = [...expected].sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0).map(([name, digest]) => `${digest}  ${name}`).join('\n') + '\n';
          const digest = 'sha256:' + createHash('sha256').update(content).digest('hex');
          const original = release.assets.find(asset => asset.name === 'SHA256SUMS.txt');
          if (original?.digest === digest) { console.log('Published checksums already match the exact package names and hashes.'); process.exit(0); }
          if (original && (original.id !== 662883299 || original.digest !== 'sha256:4f692c41f58d836a3a9cb68112c3817cafe8d91d750d5f110b6decac6b2c9ea6')) throw new Error('Original checksum asset changed.');
          const temporaryName = 'SHA256SUMS-corrected-' + digest.slice(7, 19) + '.txt';
          let replacement = release.assets.find(asset => asset.name === temporaryName);
          if (!replacement) {
            const upload = release.upload_url.replace(/\{.*$/, '') + `?name=${encodeURIComponent(temporaryName)}`;
            if (!upload.startsWith(`https://uploads.github.com/repos/${repository}/`)) throw new Error('Unexpected upload URL.');
            const response = await fetch(upload, { method: 'POST', headers: { ...headers, 'Content-Type': 'text/plain' }, body: content });
            if (!response.ok) throw new Error(`Checksum upload failed: ${response.status}`);
            replacement = await response.json();
          }
          if (replacement.name !== temporaryName || replacement.state !== 'uploaded' || replacement.digest !== digest) throw new Error('Replacement checksum did not verify.');
          const before = await api(`releases/${release.id}/assets`);
          verifyPackages(before);
          const current = before.find(asset => asset.name === 'SHA256SUMS.txt');
          if (current && (current.id !== original?.id || current.digest !== original.digest)) throw new Error('Checksum changed during repair.');
          if (current) await api(`releases/assets/${current.id}`, 'DELETE');
          const renamed = await api(`releases/assets/${replacement.id}`, 'PATCH', { name: 'SHA256SUMS.txt' });
          if (renamed.name !== 'SHA256SUMS.txt' || renamed.digest !== digest) throw new Error('Checksum rename did not verify.');
          const after = await api(`releases/${release.id}/assets`);
          verifyPackages(after);
          if (after.length !== 4 || after.find(asset => asset.name === 'SHA256SUMS.txt')?.digest !== digest) throw new Error('Final asset inventory did not verify.');
          console.log('Verified v0.6.0 checksums against all three unchanged published packages.');
          NODE
