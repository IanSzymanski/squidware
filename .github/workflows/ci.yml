name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm test
      - run: node --test scripts/desktop.test.cjs
      - run: pnpm build
      - name: Configure Chromium sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify sandboxed desktop renderer
        run: xvfb-run --auto-servernum pnpm exec electron . --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: squidware-renderer
          path: dist
          if-no-files-found: error
