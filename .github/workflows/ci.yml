name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm certify --layer=source
  desktop:
    needs: verify
    uses: ./.github/workflows/desktop-regression.yml
  required:
    name: CI required
    if: always()
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every certification layer
        env:
          SOURCE_RESULT: ${{ needs.verify.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: test "$SOURCE_RESULT" = success && test "$DESKTOP_RESULT" = success
