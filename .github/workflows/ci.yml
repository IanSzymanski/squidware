name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm test
      - run: pnpm test:desktop
      - run: pnpm format:check
      - run: node --test scripts/release-plan.test.mjs scripts/release-publish.test.mjs
      - run: pnpm build
      - name: Configure Chromium sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify sandboxed desktop renderer
        run: xvfb-run --auto-servernum pnpm exec electron . --smoke-test
      - name: Verify production editor workflows
        run: xvfb-run --auto-servernum pnpm test:editor
      - name: Verify keyboard accessibility and rendered text
        run: xvfb-run --auto-servernum pnpm test:accessibility
      - name: Verify tooltip pointer, focus and disabled explanations
        run: xvfb-run --auto-servernum pnpm test:tooltips
      - name: Verify tooltip capture after unavailable 3D
        run: xvfb-run --auto-servernum node scripts/tooltip-qa.mjs .qa/tooltips-fallback --force-3d-fallback
      - name: Verify preferences and paper sizes across desktop restarts
        run: xvfb-run --auto-servernum pnpm test:preferences
      - name: Verify thumbnail invalidation and selection caches
        run: xvfb-run --auto-servernum pnpm test:thumbnails
      - name: Verify playback subscriptions, static field and drag previews
        run: xvfb-run --auto-servernum pnpm test:playback
      - name: Verify recovery across desktop restarts
        run: xvfb-run --auto-servernum pnpm test:recovery
      - uses: actions/upload-artifact@v4
        with:
          name: squidware-renderer
          path: dist
          if-no-files-found: error
